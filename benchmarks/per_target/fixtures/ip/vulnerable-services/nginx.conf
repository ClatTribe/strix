server {
    listen 80 default_server;
    server_name _;

    # Root needed for the autoindex location below — without it, nginx
    # serves 404 even with autoindex on (no document tree to enumerate).
    # Caught 2026-05-20: prior fixture omitted this and autoindex was
    # silently broken; nginx-autoindex must_find went uncatchable.
    root /usr/share/nginx/html;

    # Server header is left as default — discloses version. Real production hardens this.
    server_tokens on;

    location / {
        return 200 "bench fixture\n";
        add_header Content-Type text/plain;
    }

    # Directory listing enabled on /uploads — classic misconfiguration.
    location /uploads/ {
        autoindex on;
        autoindex_exact_size off;
    }
}
