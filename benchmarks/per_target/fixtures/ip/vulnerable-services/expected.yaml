target_type: ip_address
target: 127.0.0.1
description: |
  Three deliberately-misconfigured services on localhost: unauthenticated
  Redis (6379), outdated nginx with autoindex (8080), anonymous-friendly
  vsftpd (21). Used to baseline IP-target coverage — port scanning,
  service detection, service-specific weaknesses.

  Pass `--ports` once the roadmap §3 flag lands; until then, Strix picks
  ports via its agent. Today's recall on this fixture is sensitive to
  whether the agent decides to scan beyond the top-1000 well-known ports
  (port 8080 is in the top-1000; 21100-21110 PASV ports are not).

docker:
  compose_file: docker-compose.yml
  wait_seconds: 8

expected_findings:
  - id: redis-no-auth
    category: misconfig
    cwe: CWE-306
    port: 6379
    severity: critical
    must_find: true
    description: Redis on 6379 accepts commands without authentication.

  - id: nginx-autoindex
    category: misconfig
    cwe: CWE-548
    port: 8080
    severity: medium
    must_find: true
    description: nginx exposes /uploads/ with directory listing enabled.

  - id: nginx-version-disclosure
    category: info_disclosure
    cwe: CWE-200
    port: 8080
    severity: low
    must_find: true
    description: Server header discloses nginx version (server_tokens on).

  - id: nginx-outdated
    category: misconfig
    cwe: CWE-1104
    port: 8080
    severity: medium
    must_find: false
    description: |
      nginx 1.18 has known CVEs (e.g., CVE-2021-23017). Marked
      `must_find: false` because today's Strix doesn't deterministically
      do CVE/OSV correlation (roadmap §10) — when that ships, flip to true.

  - id: vsftpd-anonymous
    category: misconfig
    cwe: CWE-732
    port: 21
    severity: medium
    must_find: false
    description: |
      vsftpd accepts the configured guest:guest credentials. Marked
      `must_find: false` because it requires an FTP-aware probe; today's
      agent rarely tests FTP services in depth (roadmap §7.4 service-specialist
      skill packs).

  - id: ftp-cleartext
    category: crypto
    cwe: CWE-319
    port: 21
    severity: low
    must_find: false
    description: |
      FTP control + data channels are cleartext. Easy finding *if* the
      agent treats FTP as worth checking. Same recall caveat as above.
