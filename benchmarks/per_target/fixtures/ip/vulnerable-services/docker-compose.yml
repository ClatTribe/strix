services:
  # Redis with no authentication, exposed on the default port.
  # Classic finding: unauthenticated Redis.
  redis-noauth:
    image: redis:6.0-alpine
    container_name: bench-redis-noauth
    command: redis-server --protected-mode no
    ports:
      - "127.0.0.1:6379:6379"

  # Old nginx with directory listing enabled — exposes /uploads/.
  # Findings: outdated server, autoindex enabled, missing security headers.
  nginx-misconfig:
    image: nginx:1.18-alpine
    container_name: bench-nginx-misconfig
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./uploads:/usr/share/nginx/html/uploads:ro

  # Anonymous-FTP-friendly vsftpd. Findings: anonymous access, no TLS.
  vsftpd:
    image: fauria/vsftpd
    container_name: bench-vsftpd
    environment:
      - FTP_USER=guest
      - FTP_PASS=guest
      - PASV_ADDRESS=127.0.0.1
      - PASV_MIN_PORT=21100
      - PASV_MAX_PORT=21110
    ports:
      - "127.0.0.1:21:21"
      - "127.0.0.1:21100-21110:21100-21110"
