# OWASP WebGoat — iter-15 tougher web_application fixture.
#
# Safety: every port binds to 127.0.0.1 ONLY (loopback). WebGoat
# is a deliberate-vulnerability Java app; binding to 0.0.0.0 would
# expose authenticated lessons + the H2 console (when enabled in
# the build) to anything routable to this host.
#
# Pin: webgoat/webgoat:latest — the project's published image
# stream. The `2023.8` numeric tag does NOT exist on Docker Hub;
# verified during iter-15 validation. Bumping the tag may shift
# which lessons (and thus which detection signals) the L1 surface
# exposes; re-baseline after any version change.

services:
  webgoat:
    image: webgoat/webgoat:latest
    container_name: bench-webgoat
    # 8082 host → 8080 container. Picked to avoid the typical 8080
    # conflict with juiceshop / other dev tools.
    ports:
      - "127.0.0.1:8082:8080"
    # Resource limits — WebGoat 8.x default heap is generous;
    # cap it so a runaway lesson doesn't eat the laptop.
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    # WebGoat needs to write to its own H2 file under /home/webgoat;
    # not read-only. But no host bind-mounts — container is fully
    # ephemeral, wiped on `docker compose down`.
    restart: "no"
    security_opt:
      - no-new-privileges:true
    # Standard JVM-ish app; doesn't need elevated caps.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Healthcheck against the login page so bench's docker_up()
    # wait loop has something deterministic to poll.
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/WebGoat/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
