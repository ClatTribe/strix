target_type: web_application
target: http://host.docker.internal:3001
description: |
  OWASP Juice Shop running locally via docker compose. The manifest below
  is a curated subset of Juice Shop's documented vulnerabilities — chosen
  because they're (a) discoverable via DAST, (b) deterministic in v17.2.0,
  and (c) representative of distinct categories. Juice Shop has 100+ total
  challenges; we don't try to cover them all here.

  Pinning `bkimminich/juice-shop:v17.2.0` keeps the fixture stable. Bumping
  the tag may shift which paths trigger which findings — re-baseline after
  any version bump.

docker:
  compose_file: docker-compose.yml
  wait_url: http://127.0.0.1:3001/rest/admin/application-version
  wait_timeout_seconds: 90

# iter-31.9 — surface_discovery_breadth ground truth. Curated lower
# bound on the unique HTTP endpoints L1's recon (katana + openapi
# ingest + crawler) SHOULD discover. Juice Shop has ~80 distinct API
# routes + ~50 SPA routes — we set the bench target at 60 which is
# a conservative recall floor that exercises pre-auth crawl + JS
# parsing without requiring every hash-route to be visited.
expected_endpoint_count: 60

expected_findings:
  - id: sqli-login
    category: sqli
    cwe: CWE-89
    endpoint: /rest/user/login
    severity: critical
    must_find: true
    description: Login endpoint is SQLi-vulnerable; classic `' OR 1=1--` bypasses auth.

  - id: xss-search
    category: xss
    cwe: CWE-79
    endpoint: /#/search
    severity: medium
    must_find: true
    description: Product search reflects the `q` parameter unescaped.

  - id: idor-basket
    category: idor
    cwe: CWE-639
    endpoint: /api/Baskets
    severity: high
    must_find: true
    description: Basket access does not enforce ownership; `/api/Baskets/<other-user-id>` returns content.

  - id: missing-auth-admin
    category: authz
    cwe: CWE-862
    endpoint: /#/administration
    severity: high
    must_find: true
    description: Admin section reachable by any authenticated user; should be admin-only.

  - id: directory-traversal-ftp
    category: path_traversal
    cwe: CWE-22
    endpoint: /ftp
    severity: medium
    must_find: true
    description: /ftp serves arbitrary files via path traversal.

  - id: weak-jwt-handling
    category: jwt
    cwe: CWE-347
    endpoint: /rest/user/whoami
    severity: high
    must_find: true
    description: Tokens accept the `none` algorithm and/or weak HMAC keys.

  - id: deprecated-interface
    category: misconfig
    cwe: CWE-489
    endpoint: /b2b/v2/orders
    severity: medium
    must_find: true
    description: Deprecated B2B endpoint reachable; XXE via XML body.

  - id: nosqli-products
    category: sqli
    cwe: CWE-943
    endpoint: /rest/products/search
    severity: high
    must_find: true
    description: Product review search accepts a NoSQL operator payload.

  - id: ssrf-image-upload
    category: ssrf
    cwe: CWE-918
    endpoint: /profile
    severity: high
    must_find: false
    description: "Profile-image-from-URL fetches arbitrary URLs server-side. Marked `must_find: false` because it requires authenticated upload — recall depends on auth handling (§2 in roadmap)."

  - id: open-redirect-redirect
    category: open_redirect
    cwe: CWE-601
    endpoint: /redirect
    severity: medium
    must_find: true
    description: "`/redirect?to=...` allows arbitrary external destinations."

# iter-31.1 — FP-decoys for juiceshop (web_application target).
# These planted-decoy categories are typical FP-shapes any DAST tool
# generates against a CRUD-heavy SPA. L1.5 should suppress them.
expected_dismissed:
  - id: csrf-on-stateless-api-endpoint
    category: csrf
    reason: api_endpoint_stateless
    description: |
      A CSRF finding on /api/Challenges (the SUT's own scoreboard
      endpoint) — it's a read-only public API, no state mutation,
      CSRF doesn't apply. L1.5 should drop based on stateless-API
      detection.

  - id: hardcoded-secret-from-public-jwt
    category: hardcoded_secret
    reason: public_jwt_in_response
    description: |
      A JWT in /rest/products that's the standard demo product-listing
      response — not a leaked credential. L1.5 should distinguish
      "JWT in body" from "leaked auth token."

  - id: open-redirect-on-asset-cdn
    category: open_redirect
    reason: static_asset_cdn
    description: |
      A "redirect to user-controlled URL" finding on /static/redirect-to-
      logo.png — a static-asset rewrite, not an open-redirect vuln.
      L1.5 should drop based on static-asset endpoint classification.

# iter-31.2 — Expected attack chains that L1.5's mid_scan_correlate
# (iter-27.2) SHOULD promote into multi-step chain findings. Each chain
# is composed of finding IDs from `expected_findings[]` above.
#
# The chain is matched when ≥50% of the listed members appear in the
# actual chain's members[] (substring match in either direction). The
# bench computes `chain_detection_rate` per fixture and aggregate.
expected_chains:
  - id: auth-bypass-to-admin
    kind: privilege-escalation
    members:
      - sqli-login
      - missing-auth-admin
    severity: critical
    description: |
      SQLi on /rest/user/login bypasses auth → resulting session can
      reach /#/administration which lacks role enforcement. Chain
      bumps both findings to "active breach path."

  - id: idor-to-data-exfil
    kind: data-exfil
    members:
      - idor-basket
      - weak-jwt-handling
    severity: high
    description: |
      Forged JWT (weak HMAC / alg=none) enables horizontal access to
      other users' baskets via IDOR. Chain encodes "credential
      forgery enables BOLA at scale."
