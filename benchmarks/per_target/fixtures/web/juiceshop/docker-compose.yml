services:
  juiceshop:
    image: bkimminich/juice-shop:v17.2.0
    container_name: bench-juiceshop
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/rest/admin/application-version || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
