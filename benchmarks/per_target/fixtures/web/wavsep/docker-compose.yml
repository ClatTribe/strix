services:
  # iter-Q5.34 — WAVSEP (Web Application Vulnerability Scanner
  # Evaluation Project) — the canonical neutral DAST corpus.
  #
  # WAVSEP is a deliberately-vulnerable Java webapp that exposes
  # thousands of test cases across SQL injection (CWE-89), reflected
  # XSS (CWE-79), local file inclusion (CWE-22 / CWE-98), path
  # traversal (CWE-22), open redirect (CWE-601), and others. Each
  # test case has a deterministic URL of the form:
  #
  #   /wavsep/active/<Category>-Detection-Evaluation-<METHOD>-<RESPONSE>/CaseNN-*.jsp
  #
  # The bench harness maps strix's emitted findings back to these test
  # cases by URL path and scores TP/FP/TN/FN against the fixture's
  # expected-cases.csv.
  #
  # Comparators on the published Shay Chen DAST comparison: Acunetix,
  # Burp Active Scan, Netsparker, IBM AppScan, HP WebInspect, ZAP.
  #
  # Image: `zaproxy/wavsep` — maintained by the ZAP team. The image
  # ships a 12 MB `wavsep.war` in /opt/tomcat/webapps/ which Tomcat
  # auto-extracts on startup to /opt/tomcat/webapps/wavsep/ (2,118
  # JSP test cases + index-active.jsp landing page).
  #
  # iter-Q7.1 — DO NOT bind-mount anything inside /opt/tomcat/webapps/wavsep/.
  # Pre-Q7.1, the fixture bind-mounted scan-entry-points.html there;
  # the mount created /wavsep/ as a non-empty directory BEFORE Tomcat
  # could expand wavsep.war into it, so Tomcat skipped the auto-deploy
  # entirely. The deployed server then served only the mounted file
  # and 404'd every actual test-case URL. The Q5.34l bench wasted 53
  # minutes scanning that empty server and produced 98 pattern-match
  # false positives on Tomcat's encoded URL reflection in 400/404
  # error pages.
  #
  # The Q7.2 fixture smoke gate now guards against this regression —
  # it HEADs 10 expected URLs after compose-up and refuses to run if
  # fewer than 50% are 2xx. Bypass with STRIX_WAVSEP_SKIP_FIXTURE_SMOKE=1.
  #
  # Strix scans the WAVSEP-native /wavsep/index-active.jsp landing
  # page, which links to every active test case the image deploys.
  # The scan-entry-points.html and generate_entrypoints.py files are
  # retained in the fixture directory as documentation of the URL set
  # used by expected-cases.csv — they are no longer bind-mounted.
  #
  # Operator escape: override `WAVSEP_IMAGE` to swap the image.
  wavsep:
    image: ${WAVSEP_IMAGE:-zaproxy/wavsep:latest}
    container_name: bench-wavsep
    ports:
      - "8098:8080"  # 8098 to avoid clashing with the OWASP Benchmark fixture
    # iter-Q7.1 — no volumes. wavsep.war auto-extracts on Tomcat start.
    # See the Q7.1 comment block above for the root cause this avoids.
    healthcheck:
      # Healthcheck targets the post-extraction landing page so the
      # check only flips green AFTER the war has expanded. Pre-Q7.1
      # this checked /wavsep/ which was already 200 from the (broken)
      # mount even when the war hadn't extracted.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/wavsep/index-active.jsp || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 90s  # war extraction + MySQL init takes ~45-60s
    restart: unless-stopped
