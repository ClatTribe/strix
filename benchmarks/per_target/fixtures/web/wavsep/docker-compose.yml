services:
  # iter-Q5.34 — WAVSEP (Web Application Vulnerability Scanner
  # Evaluation Project) — the canonical neutral DAST corpus.
  #
  # WAVSEP is a deliberately-vulnerable Java webapp that exposes
  # thousands of test cases across SQL injection (CWE-89), reflected
  # XSS (CWE-79), local file inclusion (CWE-22 / CWE-98), path
  # traversal (CWE-22), open redirect (CWE-601), and others. Each
  # test case has a deterministic URL of the form:
  #
  #   /wavsep/active/<Category>-Detection-Evaluation-<METHOD>-<RESPONSE>/CaseNN-*.jsp
  #
  # The bench harness maps strix's emitted findings back to these test
  # cases by URL path and scores TP/FP/TN/FN against the fixture's
  # expected-cases.csv.
  #
  # Comparators on the published Shay Chen DAST comparison: Acunetix,
  # Burp Active Scan, Netsparker, IBM AppScan, HP WebInspect, ZAP.
  #
  # Image: `zaproxy/wavsep` — maintained by the ZAP team (the same
  # team that uses WAVSEP for their own DAST benchmarking). The
  # "version of WAVSEP now maintained by the ZAP Team" banner appears
  # on the root /wavsep/ page. Operator escape: override `WAVSEP_IMAGE`
  # to swap the image.
  wavsep:
    image: ${WAVSEP_IMAGE:-zaproxy/wavsep:latest}
    container_name: bench-wavsep
    ports:
      - "8098:8080"  # 8098 to avoid clashing with the OWASP Benchmark fixture
    volumes:
      # iter-Q5.34c — bake in a flat landing page that lists every
      # WAVSEP test case URL as an <a href>. The WAVSEP root
      # /wavsep/ documents that it "intentionally lacks links and
      # forms"; crawlers (katana / sqlmap-crawl / nuclei) dead-end
      # there. This mount makes /wavsep/scan-entry-points.html serve
      # the 1,133-link landing page so strix's crawl-then-scan loop
      # has somewhere to start. Generated deterministically from
      # expected-cases.csv via generate_entrypoints.py.
      - ./scan-entry-points.html:/opt/tomcat/webapps/wavsep/scan-entry-points.html:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/wavsep/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    restart: unless-stopped
