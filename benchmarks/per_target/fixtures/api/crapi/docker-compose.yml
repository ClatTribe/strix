# OWASP crAPI (Completely Ridiculous API)
#
# Source: https://github.com/OWASP/crAPI
# Image registry: docker.io/crapi/* (Docker Hub)
#
# crAPI is a microservice-architected vulnerable application designed
# specifically to demonstrate OWASP API Top 10. The full stack runs
# under docker-compose with ~7 services. This file pulls the official
# OWASP-published compose, pinning to a specific tag for fixture
# reproducibility.
#
# Pin reason: tag floats break the fixture's expected.yaml manifest.
# When OWASP publishes a new crAPI version with shifted endpoints,
# bump the tag here AND re-baseline expected.yaml against it.
#
# Pin history:
#   2024-Q4 — pinned to 0.7.0 (initial fixture build)
#   2026-05-19 — repinned to 1.1.6-rc8. OWASP retired the 0.7.0
#     tags from Docker Hub between Q4 2024 and Q2 2026; the 0.7.0
#     pulls started returning HTTP 404 (broke the runner with
#     `docker compose up` exit 1 before strix was ever invoked).
#     1.1.6-rc8 is the most recent immutable tag that exists for
#     all four crapi services (identity / community / workshop /
#     web). The final 1.1.6 tag only landed on identity; the other
#     three jump straight from rc8 to floating `main`/`latest`.
#     FOLLOW-UP: this fixture's expected.yaml was baselined against
#     0.7.0 endpoints. The crAPI HTTP surface drifted between 0.7.0
#     and 1.1.6 (rate-limit endpoints renamed, JWT secret defaults
#     changed). Re-baseline expected.yaml against 1.1.6-rc8 in a
#     separate PR — until then, this fixture's recall numbers are
#     not directly comparable to the 2024-Q4 baseline.
#
# Network: services bind to 8888 (web), 8080 (API), 8000 (mailhog UI),
# 8025 (mailhog SMTP). The benchmark target is the API at 8080.

x-crapi-image: &crapi-image
  pull_policy: always

services:
  crapi-identity:
    image: crapi/crapi-identity:1.1.6-rc8
    <<: *crapi-image
    container_name: bench-crapi-identity
    environment:
      DB_NAME: crapi
      DB_USER: admin
      DB_PASSWORD: crapisecretpassword
      DB_HOST: postgresdb
      DB_PORT: 5432
      JWT_EXPIRATION_TIME: 86400000
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    depends_on:
      postgresdb:
        condition: service_healthy
    networks:
      - bench-crapi
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/identity/health-check"]
      interval: 15s
      timeout: 10s
      retries: 10

  crapi-community:
    image: crapi/crapi-community:1.1.6-rc8
    <<: *crapi-image
    container_name: bench-crapi-community
    environment:
      MONGO_DB_HOST: mongodb
      MONGO_DB_PORT: 27017
      IDENTITY_SERVICE_HOST: crapi-identity
      IDENTITY_SERVICE_PORT: 8080
    depends_on:
      mongodb:
        condition: service_healthy
      crapi-identity:
        condition: service_healthy
    networks:
      - bench-crapi

  crapi-workshop:
    image: crapi/crapi-workshop:1.1.6-rc8
    <<: *crapi-image
    container_name: bench-crapi-workshop
    environment:
      MONGO_DB_HOST: mongodb
      MONGO_DB_PORT: 27017
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - bench-crapi

  crapi-web:
    image: crapi/crapi-web:1.1.6-rc8
    <<: *crapi-image
    container_name: bench-crapi-web
    ports:
      - "8888:80"
      - "8025:8025"
    environment:
      IDENTITY_HOST: crapi-identity
      COMMUNITY_HOST: crapi-community
      WORKSHOP_HOST: crapi-workshop
    depends_on:
      - crapi-identity
      - crapi-community
      - crapi-workshop
    networks:
      - bench-crapi

  postgresdb:
    image: postgres:14
    container_name: bench-crapi-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: crapisecretpassword
      POSTGRES_DB: crapi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d crapi"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bench-crapi

  mongodb:
    image: mongo:6
    container_name: bench-crapi-mongo
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bench-crapi

  mailhog:
    image: mailhog/mailhog
    container_name: bench-crapi-mailhog
    ports:
      - "8025:8025"
    networks:
      - bench-crapi

networks:
  bench-crapi:
    driver: bridge
