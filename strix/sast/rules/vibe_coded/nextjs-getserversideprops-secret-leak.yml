rules:
  - id: strix-nextjs-getserversideprops-secret-leak
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      `getServerSideProps` (or `generateStaticParams`) returns
      `process.env` directly. The returned props are serialised
      into the HTML and shipped to the browser — any non-public
      env var (DB_URL, API_KEY, JWT_SECRET) leaks. Filter to
      explicitly-public values prefixed with `NEXT_PUBLIC_`,
      or read secrets only inside route handlers (never as props).
    metadata:
      cwe: "CWE-200"
      owasp: "A02:2021"
      category: info_disclosure
      confidence: HIGH
      vibe_pattern: true
    pattern-either:
      - pattern: |
          export async function getServerSideProps(...) {
            ...
            return { props: { ..., env: process.env, ... } }
          }
      - pattern: |
          export async function getServerSideProps(...) {
            ...
            return { props: process.env }
          }
      - pattern: |
          export async function getServerSideProps(...) {
            ...
            return { props: {...process.env} }
          }
      - pattern: |
          export async function getStaticProps(...) {
            ...
            return { props: {...process.env} }
          }
