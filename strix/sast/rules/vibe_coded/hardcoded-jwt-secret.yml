rules:
  - id: strix-hardcoded-jwt-secret
    languages: [javascript, typescript, python]
    severity: ERROR
    message: >-
      JWT secret hardcoded as a literal string. Anyone with source
      access (Git history, Docker layer, build artifact) can mint
      arbitrary tokens. Move to an environment variable read at
      startup; rotate any tokens issued with the leaked secret.
    metadata:
      cwe: "CWE-798"
      owasp: "A07:2021"
      category: info_disclosure
      confidence: HIGH
      vibe_pattern: true
    pattern-either:
      - pattern: |
          jwt.sign($DATA, "...")
      - pattern: |
          jwt.verify($TOKEN, "...")
      - pattern: |
          jsonwebtoken.sign($DATA, "...")
      - pattern: |
          $JWT.sign($DATA, "...", ...)
      - pattern: |
          jwt.encode($DATA, "...", ...)
      - patterns:
          - pattern: |
              const $X = "..."
          - metavariable-regex:
              metavariable: $X
              regex: ^(JWT_SECRET|jwtSecret|JWT_KEY|tokenSecret|TOKEN_SECRET)$
