rules:
  - id: strix-crypto-ecb-mode
    languages: [javascript, typescript, python]
    severity: ERROR
    message: >-
      AES in ECB mode. ECB encrypts identical plaintext blocks
      to identical ciphertext blocks — patterns in the data
      survive encryption. Use GCM mode for authenticated
      encryption (`aes-256-gcm`). The classic visual proof is
      the ECB-encrypted Tux penguin image.
    metadata:
      cwe: "CWE-327"
      owasp: "A02:2021"
      category: crypto
      confidence: HIGH
      vibe_pattern: true
    pattern-either:
      - pattern: |
          crypto.createCipheriv("aes-128-ecb", ...)
      - pattern: |
          crypto.createCipheriv("aes-192-ecb", ...)
      - pattern: |
          crypto.createCipheriv("aes-256-ecb", ...)
      - pattern: |
          crypto.createCipher($CIPHER, $K)
      - pattern: |
          AES.new($KEY, AES.MODE_ECB)
      - pattern: |
          Cipher(algorithms.AES($KEY), modes.ECB(), ...)
