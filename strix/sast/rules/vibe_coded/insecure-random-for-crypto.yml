rules:
  - id: strix-insecure-random-for-crypto
    languages: [javascript, typescript, python]
    severity: WARNING
    message: >-
      `Math.random()` / `random.random()` is NOT cryptographically
      secure — its output is predictable from a small number of
      observed samples. Used for a session token / password reset
      / API key, an attacker can reproduce the value. Use
      `crypto.randomBytes()` (Node) or `secrets.token_*`
      (Python) instead.
    metadata:
      cwe: "CWE-338"
      owasp: "A02:2021"
      category: crypto
      confidence: MEDIUM
      vibe_pattern: true
    pattern-either:
      - patterns:
          - pattern: |
              const $X = Math.random()
          - metavariable-regex:
              metavariable: $X
              regex: ^(token|secret|sessionId|session_id|apiKey|api_key|resetToken|reset_token|nonce|csrfToken|csrf_token|otp|inviteCode|invite_code|password|salt)$
      - patterns:
          - pattern: |
              $X = random.random()
          - metavariable-regex:
              metavariable: $X
              regex: ^(token|secret|session_id|api_key|reset_token|nonce|csrf_token|otp|invite_code|password|salt)$
      - patterns:
          - pattern: |
              $X = random.randint($A, $B)
          - metavariable-regex:
              metavariable: $X
              regex: ^(otp|password|invite_code|token)$
      # Match Math.random() called inside any function whose
      # name suggests a security-sensitive purpose (token /
      # secret / password / key / etc generator). Uses
      # `pattern-inside` to scope the match WITHOUT requiring
      # the rule to parse the whole function body — that's
      # what broke the original block-style pattern when JS
      # chained calls like `Math.random().toString(36).slice(2)`
      # were used (semgrep treats the chain as a single
      # expression that doesn't unify with `... Math.random() ...`
      # inside a function block).
      # Caught measuring sast-vibe fixture 2026-05-21.
      - patterns:
          - pattern: Math.random()
          - pattern-inside: |
              function $FN(...) {
                ...
              }
          - metavariable-regex:
              metavariable: $FN
              regex: (?i).*(token|secret|password|key|nonce|salt|otp|csrf|session|reset|invite|api).*
      - patterns:
          - pattern: Math.random()
          - pattern-inside: |
              const $FN = (...) => {
                ...
              }
          - metavariable-regex:
              metavariable: $FN
              regex: (?i).*(token|secret|password|key|nonce|salt|otp|csrf|session|reset|invite|api).*
      - patterns:
          - pattern: Math.random()
          - pattern-inside: |
              $FN = function(...) {
                ...
              }
          - metavariable-regex:
              metavariable: $FN
              regex: (?i).*(token|secret|password|key|nonce|salt|otp|csrf|session|reset|invite|api).*
