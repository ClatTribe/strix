rules:
  # Catches the canonical vibe-coded pattern of hardcoded credentials
  # in module-level constants:
  #   API_KEY = "sk_test_..."
  #   SECRET_KEY = "static-secret-change-me"
  #   AWS_SECRET = "AKIA..."
  #
  # This is intentionally restrictive on the variable name (must
  # contain `KEY`, `SECRET`, `TOKEN`, `PASSWORD`, or `PASSWD`) to
  # avoid the false-positive rate of pure-entropy detectors. The
  # canonical false-positive (`SECRET_LENGTH = "16"`) is filtered
  # by the `metavariable-regex` on $VAL requiring ≥16-char strings.
  #
  # Doesn't replace `secrets_scan` (gitleaks/trufflehog with much
  # broader pattern coverage) — this is a fallback for when
  # secrets_scan isn't available (native execution outside the
  # strix-sandbox).
  - id: strix-hardcoded-credential-literal
    languages: [python, javascript, typescript]
    severity: ERROR
    message: >-
      Hardcoded credential literal assigned to a credential-named
      identifier. Move to an environment variable or a secret-
      manager; commit history retains the leak indefinitely.
    metadata:
      cwe: "CWE-798"
      owasp: "A07:2021"
      category: info_disclosure
      confidence: MEDIUM
      vibe_pattern: true
    pattern-either:
      # Top-level Python / module-level assignment shape.
      - patterns:
          - pattern: $NAME = "$VAL"
          - metavariable-regex:
              metavariable: $NAME
              regex: '.*(KEY|SECRET|TOKEN|PASSWORD|PASSWD|API.?KEY|PRIVATE).*'
          - metavariable-regex:
              metavariable: $VAL
              # Require ≥16 chars and at least one digit + one letter
              # (filters out placeholders like "TODO" / "changeme").
              # Allow common literal prefixes (sk_, AKIA, ghp_, etc.).
              regex: '^([A-Za-z][A-Za-z0-9_\-\.]{15,}|[A-Za-z0-9_\-]{16,})$'
      # JavaScript / Node `const API_KEY = "..."` shape.
      - patterns:
          - pattern: const $NAME = "$VAL"
          - metavariable-regex:
              metavariable: $NAME
              regex: '.*(KEY|SECRET|TOKEN|PASSWORD|PASSWD|API.?KEY|PRIVATE).*'
          - metavariable-regex:
              metavariable: $VAL
              regex: '^([A-Za-z][A-Za-z0-9_\-\.]{15,}|[A-Za-z0-9_\-]{16,})$'
      # `let API_KEY = "..."` shape.
      - patterns:
          - pattern: let $NAME = "$VAL"
          - metavariable-regex:
              metavariable: $NAME
              regex: '.*(KEY|SECRET|TOKEN|PASSWORD|PASSWD|API.?KEY|PRIVATE).*'
          - metavariable-regex:
              metavariable: $VAL
              regex: '^([A-Za-z][A-Za-z0-9_\-\.]{15,}|[A-Za-z0-9_\-]{16,})$'
