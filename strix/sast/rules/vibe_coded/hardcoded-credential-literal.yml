# Split into per-language rules — 2026-05-21 — because the original
# single-rule form combined Python `$NAME = "$VAL"` patterns with
# JavaScript `const/let $NAME = "$VAL"` patterns. semgrep tries to
# parse `const $NAME = "$VAL"` as Python and errors out:
# `Pattern parse error in rule strix-hardcoded-credential-literal:
# Invalid pattern for Python: const $NAME = "$VAL"`. A failing-to-
# parse rule is silently dropped — so this rule (which catches the
# canonical `API_KEY = "sk_..."` vibe-coded pattern) never fired in
# practice. flask-vuln's `hardcoded-secret` must_find got picked up
# accidentally via a different rule's match path; sast-vibe's
# `sast-hardcoded-jwt-secret` worked because that test JS file
# happens to use bare `=` (not `const`) which the Python pattern
# happened to also unify against.

rules:
  # Catches the canonical vibe-coded pattern of hardcoded credentials
  # in module-level constants:
  #   API_KEY = "sk_test_..."
  #   SECRET_KEY = "static-secret-change-me"
  #   AWS_SECRET = "AKIA..."
  #
  # This is intentionally restrictive on the variable name (must
  # contain `KEY`, `SECRET`, `TOKEN`, `PASSWORD`, or `PASSWD`) to
  # avoid the false-positive rate of pure-entropy detectors. The
  # canonical false-positive (`SECRET_LENGTH = "16"`) is filtered
  # by the `metavariable-regex` on $VAL requiring ≥16-char strings.
  #
  # Doesn't replace `secrets_scan` (gitleaks/trufflehog with much
  # broader pattern coverage) — this is a fallback for when
  # secrets_scan isn't available (native execution outside the
  # strix-sandbox).
  - id: strix-hardcoded-credential-literal-python
    languages: [python]
    severity: ERROR
    message: >-
      Hardcoded credential literal assigned to a credential-named
      identifier. Move to an environment variable or a secret-
      manager; commit history retains the leak indefinitely.
    metadata:
      cwe: "CWE-798"
      owasp: "A07:2021"
      category: info_disclosure
      confidence: MEDIUM
      vibe_pattern: true
    patterns:
      - pattern: $NAME = "$VAL"
      - metavariable-regex:
          metavariable: $NAME
          regex: '.*(KEY|SECRET|TOKEN|PASSWORD|PASSWD|API.?KEY|PRIVATE).*'
      - metavariable-regex:
          metavariable: $VAL
          # Require ≥16 chars and at least one digit + one letter
          # (filters out placeholders like "TODO" / "changeme").
          # Allow common literal prefixes (sk_, AKIA, ghp_, etc.).
          regex: '^([A-Za-z][A-Za-z0-9_\-\.]{15,}|[A-Za-z0-9_\-]{16,})$'

  - id: strix-hardcoded-credential-literal-js
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Hardcoded credential literal assigned to a credential-named
      identifier. Move to an environment variable or a secret-
      manager; commit history retains the leak indefinitely.
    metadata:
      cwe: "CWE-798"
      owasp: "A07:2021"
      category: info_disclosure
      confidence: MEDIUM
      vibe_pattern: true
    pattern-either:
      # `const API_KEY = "..."`
      - patterns:
          - pattern: const $NAME = "$VAL"
          - metavariable-regex:
              metavariable: $NAME
              regex: '.*(KEY|SECRET|TOKEN|PASSWORD|PASSWD|API.?KEY|PRIVATE).*'
          - metavariable-regex:
              metavariable: $VAL
              regex: '^([A-Za-z][A-Za-z0-9_\-\.]{15,}|[A-Za-z0-9_\-]{16,})$'
      # `let API_KEY = "..."`
      - patterns:
          - pattern: let $NAME = "$VAL"
          - metavariable-regex:
              metavariable: $NAME
              regex: '.*(KEY|SECRET|TOKEN|PASSWORD|PASSWD|API.?KEY|PRIVATE).*'
          - metavariable-regex:
              metavariable: $VAL
              regex: '^([A-Za-z][A-Za-z0-9_\-\.]{15,}|[A-Za-z0-9_\-]{16,})$'
      # `var API_KEY = "..."`
      - patterns:
          - pattern: var $NAME = "$VAL"
          - metavariable-regex:
              metavariable: $NAME
              regex: '.*(KEY|SECRET|TOKEN|PASSWORD|PASSWD|API.?KEY|PRIVATE).*'
          - metavariable-regex:
              metavariable: $VAL
              regex: '^([A-Za-z][A-Za-z0-9_\-\.]{15,}|[A-Za-z0-9_\-]{16,})$'
      # Bare `API_KEY = "..."` (module-level, no declaration kw)
      - patterns:
          - pattern: $NAME = "$VAL"
          - metavariable-regex:
              metavariable: $NAME
              regex: '.*(KEY|SECRET|TOKEN|PASSWORD|PASSWD|API.?KEY|PRIVATE).*'
          - metavariable-regex:
              metavariable: $VAL
              regex: '^([A-Za-z][A-Za-z0-9_\-\.]{15,}|[A-Za-z0-9_\-]{16,})$'
